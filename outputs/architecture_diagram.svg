<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" font-family="monospace,sans-serif" font-size="11">
<rect width="760" height="540" fill="#0e1117"/>

<!-- Title -->
<text x="380" y="28" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">VeritasWatch — System Architecture</text>

<!-- Layer labels -->
<text x="14" y="82" fill="#666" font-size="10" writing-mode="vertical-rl">LAYER 1</text>
<text x="14" y="192" fill="#666" font-size="10" writing-mode="vertical-rl">LAYER 2</text>
<text x="14" y="322" fill="#666" font-size="10" writing-mode="vertical-rl">LAYER 3</text>
<text x="14" y="442" fill="#666" font-size="10" writing-mode="vertical-rl">LAYER 4</text>

<!-- LAYER 1: Ingestion -->
<rect x="36" y="48" width="130" height="60" rx="6" fill="#1a2744" stroke="#3a5a94" stroke-width="1.5"/>
<text x="101" y="68" text-anchor="middle" fill="#6ab0f5" font-weight="bold">X API v2</text>
<text x="101" y="83" text-anchor="middle" fill="#8899bb" font-size="10">Bearer Token</text>
<text x="101" y="96" text-anchor="middle" fill="#8899bb" font-size="10">Basic $100/mo</text>

<line x1="166" y1="78" x2="210" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="188" y="73" text-anchor="middle" fill="#666" font-size="9">100 tweets</text>
<text x="188" y="85" text-anchor="middle" fill="#666" font-size="9">per request</text>

<rect x="210" y="48" width="130" height="60" rx="6" fill="#1a2744" stroke="#3a5a94" stroke-width="1.5"/>
<text x="275" y="68" text-anchor="middle" fill="#6ab0f5" font-weight="bold">collector.py</text>
<text x="275" y="83" text-anchor="middle" fill="#8899bb" font-size="10">15-min polling</text>
<text x="275" y="96" text-anchor="middle" fill="#8899bb" font-size="10">lang:en -is:retweet</text>

<line x1="340" y1="78" x2="384" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="384" y="48" width="130" height="60" rx="6" fill="#1a2744" stroke="#3a5a94" stroke-width="1.5"/>
<text x="449" y="68" text-anchor="middle" fill="#6ab0f5" font-weight="bold">database.py</text>
<text x="449" y="83" text-anchor="middle" fill="#8899bb" font-size="10">SQLite</text>
<text x="449" y="96" text-anchor="middle" fill="#8899bb" font-size="10">INSERT OR IGNORE</text>

<!-- LAYER 2: Processing -->
<line x1="449" y1="108" x2="449" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="36" y="148" width="690" height="70" rx="6" fill="#181818" stroke="#444" stroke-width="1" stroke-dasharray="5,3"/>
<text x="50" y="165" fill="#888" font-size="9">SCORING ENGINE</text>

<rect x="50" y="170" width="100" height="36" rx="4" fill="#2a1a44" stroke="#7a5aaa" stroke-width="1.5"/>
<text x="100" y="184" text-anchor="middle" fill="#b090e0">scorer.py</text>
<text x="100" y="197" text-anchor="middle" fill="#8877aa" font-size="9">6 signals → 0-100</text>

<line x1="150" y1="188" x2="186" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="186" y="170" width="200" height="36" rx="4" fill="#2a1a44" stroke="#7a5aaa" stroke-width="1.5"/>
<text x="286" y="184" text-anchor="middle" fill="#b090e0">account age · followers · photo</text>
<text x="286" y="197" text-anchor="middle" fill="#8877aa" font-size="9">keyword · domain · RT velocity</text>

<line x1="386" y1="188" x2="422" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="422" y="170" width="100" height="36" rx="4" fill="#2a1a44" stroke="#7a5aaa" stroke-width="1.5"/>
<text x="472" y="184" text-anchor="middle" fill="#b090e0">triage.py</text>
<text x="472" y="197" text-anchor="middle" fill="#8877aa" font-size="9">threshold routing</text>

<line x1="522" y1="188" x2="558" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="558" y="170" width="155" height="36" rx="4" fill="#2a1a44" stroke="#7a5aaa" stroke-width="1.5"/>
<text x="635" y="184" text-anchor="middle" fill="#b090e0">0–35 / 36–60 / 61+</text>
<text x="635" y="197" text-anchor="middle" fill="#8877aa" font-size="9">pass / hold / escalate</text>

<!-- LAYER 3: Queues -->
<line x1="255" y1="218" x2="183" y2="262" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr_g)"/>
<line x1="449" y1="218" x2="449" y2="262" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arr_a)"/>
<line x1="635" y1="218" x2="710" y2="262" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr_r)"/>

<rect x="36" y="262" width="290" height="56" rx="6" fill="#162a1d" stroke="#27ae60" stroke-width="2"/>
<text x="181" y="282" text-anchor="middle" fill="#27ae60" font-weight="bold">✅ AUTO-PASS</text>
<text x="181" y="298" text-anchor="middle" fill="#4a8a5a" font-size="10">Score &lt; 36 · No review · Archived</text>
<text x="181" y="311" text-anchor="middle" fill="#4a8a5a" font-size="10">~66% of traffic</text>

<rect x="330" y="262" width="230" height="56" rx="6" fill="#2e2010" stroke="#f39c12" stroke-width="2"/>
<text x="445" y="282" text-anchor="middle" fill="#f39c12" font-weight="bold">⚠️ AUTO-HOLD</text>
<text x="445" y="298" text-anchor="middle" fill="#8a6a2a" font-size="10">Score 36–60 · Secondary review</text>
<text x="445" y="311" text-anchor="middle" fill="#8a6a2a" font-size="10">~19% of traffic</text>

<rect x="564" y="262" width="160" height="56" rx="6" fill="#2e1010" stroke="#e74c3c" stroke-width="2"/>
<text x="644" y="282" text-anchor="middle" fill="#e74c3c" font-weight="bold">🚨 ESCALATE</text>
<text x="644" y="298" text-anchor="middle" fill="#8a2a2a" font-size="10">Score 61+ · Priority review</text>
<text x="644" y="311" text-anchor="middle" fill="#8a2a2a" font-size="10">~15% of traffic</text>

<!-- No auto-action banner -->
<rect x="36" y="328" width="688" height="24" rx="4" fill="#1a1010" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,2"/>
<text x="380" y="344" text-anchor="middle" fill="#cc4444" font-size="11" font-weight="bold">⛔ NO AUTOMATED ACTION — ALL QUEUES ROUTE TO HUMAN REVIEW</text>

<!-- LAYER 4: Human Review -->
<line x1="181" y1="352" x2="350" y2="392" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="445" y1="352" x2="440" y2="392" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="644" y1="352" x2="530" y2="392" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>

<rect x="200" y="392" width="360" height="56" rx="6" fill="#1a1a2e" stroke="#4a4a8a" stroke-width="1.5"/>
<text x="380" y="413" text-anchor="middle" fill="#8888cc" font-weight="bold">Human Moderator Review</text>
<text x="380" y="429" text-anchor="middle" fill="#5a5a8a" font-size="10">Applies platform policy · Makes final decision</text>
<text x="380" y="442" text-anchor="middle" fill="#5a5a8a" font-size="10">No action / Warning / Label / Removal / Legal escalation</text>

<!-- Dashboard monitoring -->
<rect x="36" y="462" width="688" height="50" rx="6" fill="#181818" stroke="#555" stroke-width="1"/>
<text x="380" y="480" text-anchor="middle" fill="#888" font-weight="bold">📊 Streamlit Dashboard (streamlit_app.py)</text>
<text x="380" y="495" text-anchor="middle" fill="#666" font-size="10">Reads from SQLite · Zero writes · Live replay mode · Threshold override sliders</text>
<text x="380" y="508" text-anchor="middle" fill="#666" font-size="10">Deployed at: veritaswatch.streamlit.app</text>

<!-- Arrow markers -->
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="arr_g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="arr_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="arr_r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
</svg>
