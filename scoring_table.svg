<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg"
     font-family="'Courier New',monospace" font-size="11">
  <rect width="760" height="380" fill="#0e1117"/>
  <text x="380" y="28" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold" font-family="Arial,sans-serif">VeritasWatch — Scoring Signal Table</text>
  <text x="380" y="45" text-anchor="middle" fill="#666" font-size="9" font-family="Arial,sans-serif">Score capped at 100. No single signal can reach escalation threshold (61).</text>
  <rect x="20" y="58" width="720" height="22" fill="#1e2a44"/>
  <text x="30"  y="73" fill="#6ab0f5" font-weight="bold" font-size="10">SIGNAL</text>
  <text x="220" y="73" fill="#6ab0f5" font-weight="bold" font-size="10">CONDITION</text>
  <text x="420" y="73" fill="#6ab0f5" font-weight="bold" font-size="10">POINTS</text>
  <text x="480" y="73" fill="#6ab0f5" font-weight="bold" font-size="10">RESEARCH BASIS</text>
  <rect x="20" y="80" width="720" height="22" fill="#13171f"/>
  <text x="30"  y="95" fill="#c0c8d8" font-size="10">1. Account age</text>
  <text x="220" y="95" fill="#c0c8d8" font-size="10">Created &lt; 30 days ago</text>
  <rect x="415" y="84" width="42" height="14" rx="3" fill="#b03030"/>
  <text x="436" y="95" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">+20</text>
  <text x="480" y="95" fill="#8899bb" font-size="9">Cresci (2020), CACM</text>
  <rect x="20" y="102" width="720" height="20" fill="#0e1117"/>
  <text x="30"  y="116" fill="#667788" font-size="10">1b. Account age (partial)</text>
  <text x="220" y="116" fill="#667788" font-size="10">Created 30-90 days ago</text>
  <rect x="415" y="106" width="42" height="14" rx="3" fill="#805020"/>
  <text x="436" y="116" fill="#fff" font-size="10" text-anchor="middle">+10</text>
  <text x="480" y="116" fill="#556677" font-size="9">Ferrara et al. (2016), CACM</text>
  <rect x="20" y="122" width="720" height="22" fill="#13171f"/>
  <text x="30"  y="137" fill="#c0c8d8" font-size="10">2. Follower count</text>
  <text x="220" y="137" fill="#c0c8d8" font-size="10">&lt; 10 followers</text>
  <rect x="415" y="126" width="42" height="14" rx="3" fill="#8a4020"/>
  <text x="436" y="137" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">+15</text>
  <text x="480" y="137" fill="#8899bb" font-size="9">Disposable amplification accounts</text>
  <rect x="20" y="144" width="720" height="22" fill="#0e1117"/>
  <text x="30"  y="159" fill="#c0c8d8" font-size="10">3. Profile photo absent</text>
  <text x="220" y="159" fill="#c0c8d8" font-size="10">Default/missing avatar</text>
  <rect x="415" y="148" width="42" height="14" rx="3" fill="#505830"/>
  <text x="436" y="159" fill="#fff" font-size="10" text-anchor="middle">+10</text>
  <text x="480" y="159" fill="#8899bb" font-size="9">Low-investment account signal</text>
  <rect x="20" y="166" width="720" height="22" fill="#13171f"/>
  <text x="30"  y="181" fill="#c0c8d8" font-size="10">4. Keyword signals</text>
  <text x="220" y="181" fill="#c0c8d8" font-size="10">2+ alarm phrases in text</text>
  <rect x="415" y="170" width="42" height="14" rx="3" fill="#b03030"/>
  <text x="436" y="181" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">+20</text>
  <text x="480" y="181" fill="#8899bb" font-size="9">Sharma et al. (2019), ArXiv:1901.06437</text>
  <rect x="20" y="188" width="720" height="20" fill="#0e1117"/>
  <text x="30"  y="202" fill="#667788" font-size="10">4b. Keyword (partial)</text>
  <text x="220" y="202" fill="#667788" font-size="10">1 alarm phrase</text>
  <rect x="415" y="192" width="42" height="14" rx="3" fill="#805020"/>
  <text x="436" y="202" fill="#fff" font-size="10" text-anchor="middle">+10</text>
  <text x="480" y="202" fill="#556677" font-size="9">Partial signal</text>
  <rect x="20" y="208" width="720" height="22" fill="#13171f"/>
  <text x="30"  y="223" fill="#c0c8d8" font-size="10">5. Low-credibility domain</text>
  <text x="220" y="223" fill="#c0c8d8" font-size="10">URL from blocklist</text>
  <rect x="415" y="212" width="42" height="14" rx="3" fill="#8a4020"/>
  <text x="436" y="223" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">+15</text>
  <text x="480" y="223" fill="#8899bb" font-size="9">MBFC Conspiracy-Pseudoscience; NewsGuard</text>
  <rect x="20" y="230" width="720" height="22" fill="#0e1117"/>
  <text x="30"  y="245" fill="#c0c8d8" font-size="10">6. Retweet velocity</text>
  <text x="220" y="245" fill="#c0c8d8" font-size="10">RT count &gt; 10x follower count</text>
  <rect x="415" y="234" width="42" height="14" rx="3" fill="#b03030"/>
  <text x="436" y="245" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">+20</text>
  <text x="480" y="245" fill="#8899bb" font-size="9">Vosoughi et al. (2018), Science 359:1146</text>
  <line x1="20" y1="266" x2="740" y2="266" stroke="#2a3560" stroke-width="1"/>
  <text x="30" y="286" fill="#e0e0e0" font-size="11" font-weight="bold" font-family="Arial,sans-serif">Triage Thresholds</text>
  <rect x="20" y="292" width="720" height="22" fill="#162a1d"/>
  <rect x="20" y="292" width="4" height="22" fill="#27ae60"/>
  <text x="35"  y="307" fill="#27ae60" font-size="10" font-weight="bold">AUTO-PASS</text>
  <text x="130" y="307" fill="#c0c8d8" font-size="10">Score 0 - 35</text>
  <text x="220" y="307" fill="#8899bb" font-size="9">No review required</text>
  <rect x="20" y="314" width="720" height="22" fill="#2e2010"/>
  <rect x="20" y="314" width="4" height="22" fill="#f39c12"/>
  <text x="35"  y="329" fill="#f39c12" font-size="10" font-weight="bold">AUTO-HOLD</text>
  <text x="130" y="329" fill="#c0c8d8" font-size="10">Score 36 - 60</text>
  <text x="220" y="329" fill="#8899bb" font-size="9">Secondary human review (not urgent)</text>
  <rect x="20" y="336" width="720" height="22" fill="#2e1010"/>
  <rect x="20" y="336" width="4" height="22" fill="#e74c3c"/>
  <text x="35"  y="351" fill="#e74c3c" font-size="10" font-weight="bold">ESCALATE</text>
  <text x="130" y="351" fill="#c0c8d8" font-size="10">Score 61 - 100</text>
  <text x="220" y="351" fill="#8899bb" font-size="9">Priority human review. NOT automatic removal.</text>
  <text x="380" y="374" text-anchor="middle" fill="#445566" font-size="9" font-family="Arial,sans-serif">No single signal can reach the escalation threshold (61). Minimum 3 signals required.</text>
</svg>